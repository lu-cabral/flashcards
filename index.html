<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCards</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <main class="main-content">
            <div class="header">
                <div class="header-left">
                    <h1>FlashCards</h1>
                    <div class="group-navigation">
                        <button id="backToGroups" class="nav-button" style="display: none;">
                            <i class="fas fa-arrow-left"></i> Voltar aos Grupos
                        </button>
                        <h2 id="currentGroupName"></h2>
                    </div>
                </div>
                <div class="header-right">
                    <button id="addGroup" class="add-button">
                        <i class="fas fa-folder-plus"></i> Novo Grupo
                    </button>
                    <button id="addFlashcard" class="add-button" style="display: none;">
                        <i class="fas fa-plus"></i> Novo Flashcard
                    </button>
                </div>
            </div>
            
            <div class="groups-grid" id="groupsList">
                <!-- Grupos serão listados aqui -->
            </div>
            
            <div class="flashcards-grid" id="flashcardsList" style="display: none;">
                <!-- Flashcards serão listados aqui -->
            </div>
            
            <div class="flashcard-display" id="flashcardDisplay" style="display: none;">
                <!-- Flashcard atual será exibido aqui -->
            </div>
        </main>
    </div>

    <!-- Modal para criar grupo -->
    <div class="modal" id="groupModal">
        <div class="modal-content">
            <h2>Criar Grupo</h2>
            <form id="groupForm">
                <div class="form-group">
                    <label for="groupName">Nome do Grupo:</label>
                    <input type="text" id="groupName" required>
                </div>
                <div class="form-group">
                    <label for="groupDescription">Descrição:</label>
                    <textarea id="groupDescription"></textarea>
                </div>
                <div class="form-group">
                    <label for="groupColor">Cor do Grupo:</label>
                    <input type="color" id="groupColor" value="#4a90e2" style="width: 50px; height: 32px; border: none;">
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="save-button">Salvar</button>
                    <button type="button" class="cancel-button" id="cancelGroupButton">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para criar/editar flashcard -->
    <div class="modal" id="flashcardModal">
        <div class="modal-content">
            <h2>Criar Flashcard</h2>
            <form id="flashcardForm">
                <div class="form-group">
                    <label for="flashcardTitle">Título:</label>
                    <input type="text" id="flashcardTitle" required>
                </div>
                <div class="form-group">
                    <label for="flashcardFront">Frente:</label>
                    <textarea id="flashcardFront" required></textarea>
                </div>
                <div class="form-group">
                    <label for="flashcardBack">Verso:</label>
                    <textarea id="flashcardBack" required></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="save-button">Salvar</button>
                    <button type="button" class="cancel-button" id="cancelButton">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
